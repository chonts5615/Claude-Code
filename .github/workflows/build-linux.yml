name: build-linux

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tech-competency-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'anthropic>=0.40,<1.0' \
            'langgraph>=0.2,<1.0' \
            'pydantic>=2.0,<3.0' \
            'click>=8.1' \
            'pyyaml>=6.0' \
            'openpyxl>=3.1' \
            'pandas>=2.2' \
            'sentence-transformers>=2.7' \
            'numpy>=1.26' \
            'scikit-learn>=1.4' \
            'python-docx>=1.1' \
            'pypdf>=4.0' \
            'tiktoken>=0.6' \
            'rapidfuzz>=3.6' \
            'pytest>=8.0' \
            'pytest-cov>=4.1' \
            'ruff>=0.2'

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Test with pytest
        run: |
          pytest tests/ --no-cov -q
