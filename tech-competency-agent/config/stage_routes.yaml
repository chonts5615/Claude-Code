# v3.1 stage routing.
# Consumed by src/orchestrator/graph.py to choose the entry node and which
# nodes to run for R1/R2/FINAL/Resume.

stages:
  R1:
    description: "Full pipeline (Phases 1-5)"
    entry_node: s1_extract_jobs
    nodes:
      - s1_extract_jobs
      - s1_gate
      - s2_map_competencies
      - s2_gate
      - s3_normalize
      - s4_audit_overlap
      - s5_remediate_overlap
      - s5_gate
      - s6_benchmark
      - s7_rank
      - s7_gate
      - s8_populate
      - s9_package

  R2:
    description: "Feedback ingestion + 6E-bis/ter/quater + CTIC + output"
    entry_node: phase6_feedback_ingestion
    nodes:
      - phase6_feedback_ingestion
      - phase6_review_metadata_gate
      - phase6_apply_edits
      - phase6E_bis_coverage_refresh
      - phase6E_ter_boundary_rescan
      - phase6E_quater_overlap_reaudit
      - phase6F_ctic_validator
      - phase6G_focus_group_prep
      - s8_populate
      - s9_package

  FINAL:
    description: "R2 + Phase 7 learning synthesis"
    entry_node: phase6_feedback_ingestion
    nodes:
      - phase6_feedback_ingestion
      - phase6_review_metadata_gate
      - phase6_apply_edits
      - phase6E_bis_coverage_refresh
      - phase6E_ter_boundary_rescan
      - phase6E_quater_overlap_reaudit
      - phase6F_ctic_validator
      - phase6G_focus_group_prep
      - s8_populate
      - s9_package
      - phase7_learning_synthesis

  RESUME:
    description: "Resume from last completed gate via ArtifactRegistry"
    entry_node: dynamic
    nodes: []
