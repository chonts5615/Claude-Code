# v3.1 V&B and Common boundary term tables.
# Consumed by src/utils/boundary_classifier.py.
#
# Rules:
# - V&B: generic term hit AND no domain-specific noun → V_AND_B
# - Common: passes "remove the domain noun" test → COMMON
# - Both V&B/Common keywords AND domain noun present → MIXED
# - Domain noun + tools/methods → TECHNICAL

