workflow_name: TechnicalCompetencyBuilder
version: 3.1

# v3.1 stage routing — see config/stage_routes.yaml
default_stage: R1

# Reference data files consumed at runtime
reference:
  band_proficiency_targets: ./config/band_proficiency_targets.yaml
  boundary_terms: ./config/boundary_terms.yaml
  domain_registry: ./config/domain_registry.yaml
  stage_routes: ./config/stage_routes.yaml
  rubric: src.schemas.rubric

# Orchestration settings
orchestration:
  max_retries_per_step: 2
  enable_parallel_processing: false
  checkpoint_enabled: true
  checkpoint_directory: ./data/checkpoints
  max_qa_cycles: 3

agents:
  job_ingestion:
    parser_type: openpyxl
    responsibility_detection_mode: newline_split

  competency_mapping:
    similarity_model: sentence-transformers/all-MiniLM-L6-v2
    lexical_weight: 0.3
    semantic_weight: 0.4
    llm_weight: 0.3
    min_relevance_threshold: 0.6

  normalizer:
    title_word_range: [3, 6]
    definition_word_range: [15, 25]
    proficiency_levels: 4
    indicators_per_level: 3

  overlap_auditor:
    similarity_model: sentence-transformers/all-MiniLM-L6-v2
    use_keyword_filtering: true

  benchmark_researcher:
    sources_priority:
      - ONET
      - ESCO
      - SFIA
      - NICE
      - industry_specific
    max_search_results_per_competency: 5

  criticality_ranker:
    factor_weights:
      coverage: 0.40
      criticality: 0.30
      distinctiveness: 0.20
      assessability: 0.10

  ctic_validator:
    max_drift_rate: 0.05

# LLM provider settings
llm:
  provider: anthropic
  model: claude-sonnet-4-5-20250929
  temperature: 0.3
  max_tokens: 4000

logging:
  level: INFO
  structured: true
  output_file: ./data/output/workflow.log
